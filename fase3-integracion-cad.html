<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Fase 3 - Integración de modelo CAD (XR industrial)</title>
    <script src="https://cdn.jsdelivr.net/npm/aframe@1.4.1/dist/aframe-master.min.js"></script>
  </head>
  <body>
    <a-scene>

      <a-assets>
        <!-- Reemplaza "models/modelo.glb" por la ruta real de tu archivo GLB
             una vez exportado desde SolidWorks -> STL -> Blender -> GLB -->
        <a-asset-item id="modeloIndustrial" src="models/modelo.glb"></a-asset-item>
      </a-assets>

      <a-light type="ambient" color="#BBB"></a-light>
      <a-light type="directional" color="#FFF" intensity="0.8" position="-1 2 1"></a-light>

      <a-plane rotation="-90 0 0" width="14" height="14" color="#7BC8A4" position="0 0 -6"></a-plane>

      <!-- Modelo CAD importado. Ajusta position/scale/rotation según el tamaño real
           del ensamblaje (los modelos de SolidWorks suelen salir en metros y
           pueden requerir escalar hacia abajo, p. ej. scale="0.01 0.01 0.01") -->
      <a-entity
        gltf-model="#modeloIndustrial"
        position="0 0 -5"
        scale="1 1 1"
        rotation="0 0 0">
      </a-entity>

      <!-- Caja de referencia visible mientras el modelo carga (opcional, ayuda a
           verificar que la escena funciona antes de que llegue el GLB pesado) -->
      <a-box id="placeholder" position="0 0.5 -5" width="0.3" height="0.3" depth="0.3"
             color="#AAAAAA" visible="true"></a-box>

      <a-sky color="#ECECEC"></a-sky>

      <a-entity camera look-controls wasd-controls position="0 1.6 2">
        <a-cursor color="#FFFFFF"></a-cursor>
      </a-entity>

    </a-scene>

    <script>
      // Oculta el placeholder en cuanto el modelo GLB termine de cargar
      document.addEventListener('DOMContentLoaded', function () {
        var modelo = document.querySelector('[gltf-model]');
        var placeholder = document.querySelector('#placeholder');
        modelo.addEventListener('model-loaded', function () {
          placeholder.setAttribute('visible', false);
          console.log('Modelo CAD cargado correctamente.');
        });
        modelo.addEventListener('model-error', function (e) {
          console.error('Error al cargar el modelo GLB:', e.detail);
        });
      });
    </script>
  </body>
</html>
